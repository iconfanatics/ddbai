version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: visasync-db
    environment:
      POSTGRES_USER: visasync
      POSTGRES_PASSWORD: visasync_password
      POSTGRES_DB: visasync_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visasync -d visasync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: visasync-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: visasync-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
    container_name: visasync-backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://visasync:visasync_password@db:5432/visasync_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadminpassword
      - JWT_SECRET=super_secret_jwt_key_for_dev_only
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: visasync-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:

